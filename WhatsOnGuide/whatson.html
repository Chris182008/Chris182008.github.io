<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Wristband Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css" />
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .gallery a {
      display: block;
      max-width: 100%;
      margin: 10px 0;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="gallery" id="gallery">
  <a href="1.jpg" data-pswp-width="724" data-pswp-height="1536" target="_blank">
    <img src="1.jpg" alt="Green & Pink Day" />
  </a>
  <a href="2.jpg" data-pswp-width="724" data-pswp-height="1536" target="_blank">
    <img src="2.jpg" alt="VIP Info" />
  </a>
  <a href="3.jpg" data-pswp-width="724" data-pswp-height="1536" target="_blank">
    <img src="3.jpg" alt="Yellow & Purple Day" />
  </a>
</div>

<!-- PhotoSwipe Core -->
<script src="https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.min.js" type="module"></script>
<script type="module">
  import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.min.js';

  const lightbox = new PhotoSwipeLightbox({
    gallery: '#gallery',
    children: 'a',
    pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.min.js')
  });

  lightbox.init();
</script>

</body>
</html>
