<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Wristband Info Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .swiper-container {
      width: 100%;
      height: 100vh;
    }

    .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto; /* allow scrolling */
    }

    .panzoom {
      touch-action: none;
    }

    img {
      max-width: none; /* allow full zoom beyond container */
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="swiper-container">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><div class="panzoom"><img src="1.jpg" alt="Green & Pink Day" /></div></div>
      <div class="swiper-slide"><div class="panzoom"><img src="2.jpg" alt="VIP Info" /></div></div>
      <div class="swiper-slide"><div class="panzoom"><img src="3.jpg" alt="Yellow & Purple Day" /></div></div>
    </div>
  </div>

  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@9.4.0/dist/panzoom.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper-container', {
      loop: false,
      spaceBetween: 10,
      centeredSlides: false,
      slidesPerView: 1,
      grabCursor: true
    });

    document.querySelectorAll('.panzoom').forEach(el => {
      Panzoom(el, {
        maxScale: 5,
        minScale: 1,
        contain: 'outside',
        panOnlyWhenZoomed: true
      });
    });
  </script>
</body>
</html>
